name: CI

on:
  push:
    branches: [ main, master, 'claude/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:latest
        options: --privileged

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile
        run: mvn -B compile

      - name: Unit tests (no Docker)
        run: mvn -B test -Dtest='!**.*IntegrationTest,!**.*ScenarioTest' -DfailIfNoTests=false
        continue-on-error: true

      - name: Package
        run: mvn -B package -DskipTests

      - name: Integration tests (Testcontainers)
        run: mvn -B test -Dtest='**/*IntegrationTest,**/*ScenarioTest' -DfailIfNoTests=false
        continue-on-error: true

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: compta-ong-jar
          path: target/*.jar
          retention-days: 7
