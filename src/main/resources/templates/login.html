<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Connexion')}"></head>
<body>
<main class="app-content">
    <div class="card" style="max-width:380px;margin:4rem auto;">
        <h2>Connexion</h2>
        <div class="alert error" th:if="${param.error}">Identifiant ou mot de passe incorrect.</div>
        <div class="alert success" th:if="${param.logout}">Vous avez ete deconnecte.</div>
        <form th:action="@{/login}" method="post">
            <label for="username">Identifiant</label>
            <input type="text" id="username" name="username" autofocus="autofocus"/>
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password"/>
            <button type="submit" class="btn" style="width:100%;">Se connecter</button>
        </form>
    </div>
</main>
</body>
</html>
