<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Aides')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="app-content">
    <div class="alert error" th:if="${erreur}" th:text="${erreur}"></div>

    <div class="card">
        <h2>Nouvelle aide</h2>
        <form th:action="@{/aides}" method="post">
            <div class="field-row">
                <div>
                    <label for="enfantId">Enfant</label>
                    <select id="enfantId" name="enfantId" required="required">
                        <option value="">-- Choisir --</option>
                        <option th:each="e : ${enfants}" th:value="${e.id}" th:text="${e.nom}"></option>
                    </select>
                </div>
                <div>
                    <label for="financementId">Financement</label>
                    <select id="financementId" name="financementId" required="required">
                        <option value="">-- Choisir --</option>
                        <option th:each="f : ${financements}" th:value="${f.id}" th:text="${f.code} + ' - ' + ${f.libelle}"></option>
                    </select>
                </div>
                <div>
                    <label for="montantMensuel">Montant mensuel</label>
                    <input type="number" id="montantMensuel" name="montantMensuel" step="0.01" min="0" required="required"/>
                </div>
            </div>
            <div class="field-row">
                <div>
                    <label for="referenceDecision">Reference decision</label>
                    <input type="text" id="referenceDecision" name="referenceDecision" required="required"/>
                </div>
                <div>
                    <label for="dateDebut">Date debut</label>
                    <input type="date" id="dateDebut" name="dateDebut" required="required"/>
                </div>
                <div>
                    <label for="dateFin">Date fin (optionnel)</label>
                    <input type="date" id="dateFin" name="dateFin"/>
                </div>
            </div>
            <button type="submit" class="btn">Creer</button>
        </form>
    </div>

    <div class="card">
        <h2>Liste des aides</h2>
        <table>
            <thead>
            <tr><th>Enfant</th><th>Financement</th><th>Montant mensuel</th><th>Decision</th><th>Debut</th><th>Fin</th><th>Statut</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="a : ${aides}">
                <td th:text="${a.enfant.nom}"></td>
                <td th:text="${a.financement.code}"></td>
                <td th:text="${a.montantMensuel}"></td>
                <td th:text="${a.referenceDecision}"></td>
                <td th:text="${a.dateDebut}"></td>
                <td th:text="${a.dateFin != null} ? ${a.dateFin} : '-'"></td>
                <td>
                    <span class="badge"
                          th:classappend="${a.statut.name() == 'ACTIVE'} ? 'validee' : (${a.statut.name() == 'SUSPENDUE'} ? 'brouillon' : 'contrepassee')"
                          th:text="${a.statut}"></span>
                </td>
                <td><a th:href="@{/aides/{id}/edit(id=${a.id})}">Modifier</a></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
