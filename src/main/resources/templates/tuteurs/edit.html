<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Modifier tuteur')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="app-content">
    <div class="alert error" th:if="${erreur}" th:text="${erreur}"></div>
    <div class="card">
        <h2>Modifier le tuteur <span th:text="${tuteur.nom}"></span></h2>
        <form th:action="@{/tuteurs/{id}/edit(id=${tuteur.id})}" method="post">
            <label for="nom">Nom</label>
            <input type="text" id="nom" name="nom" th:value="${tuteur.nom}" required="required"/>

            <label for="telephone">Telephone</label>
            <input type="text" id="telephone" name="telephone" th:value="${tuteur.telephone}"/>

            <label for="pieceIdentiteType">Type piece d'identite</label>
            <input type="text" id="pieceIdentiteType" name="pieceIdentiteType" th:value="${tuteur.pieceIdentiteType}"/>

            <label for="pieceIdentiteNumero">Numero piece d'identite</label>
            <input type="text" id="pieceIdentiteNumero" name="pieceIdentiteNumero" th:value="${tuteur.pieceIdentiteNumero}"/>

            <button type="submit" class="btn">Enregistrer</button>
            <a th:href="@{/tuteurs}" class="btn secondary">Annuler</a>
        </form>
    </div>
</main>
</body>
</html>
