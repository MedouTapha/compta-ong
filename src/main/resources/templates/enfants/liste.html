<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Enfants')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="app-content">
    <div class="alert error" th:if="${erreur}" th:text="${erreur}"></div>

    <div class="card">
        <h2>Inscrire un enfant</h2>
        <form th:action="@{/enfants}" method="post">
            <div class="field-row">
                <div>
                    <label for="nom">Nom</label>
                    <input type="text" id="nom" name="nom" required="required"/>
                </div>
                <div>
                    <label for="dateNaissance">Date de naissance</label>
                    <input type="date" id="dateNaissance" name="dateNaissance" required="required"/>
                </div>
                <div>
                    <label for="sexe">Sexe</label>
                    <select id="sexe" name="sexe">
                        <option value="M">Masculin</option>
                        <option value="F">Feminin</option>
                    </select>
                </div>
            </div>
            <div class="field-row">
                <div>
                    <label for="tuteurId">Tuteur</label>
                    <select id="tuteurId" name="tuteurId" required="required">
                        <option value="">-- Choisir --</option>
                        <option th:each="t : ${tuteurs}" th:value="${t.id}" th:text="${t.nom}"></option>
                    </select>
                </div>
                <div>
                    <label for="dateEntree">Date d'entree</label>
                    <input type="date" id="dateEntree" name="dateEntree" required="required"/>
                </div>
            </div>
            <label for="notes">Notes</label>
            <textarea id="notes" name="notes" rows="2"></textarea>
            <button type="submit" class="btn">Inscrire</button>
        </form>
    </div>

    <div class="card">
        <h2>Liste des enfants</h2>
        <table>
            <thead>
            <tr><th>Nom</th><th>Date naissance</th><th>Sexe</th><th>Tuteur</th><th>Date entree</th><th>Statut</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="e : ${enfants}">
                <td th:text="${e.nom}"></td>
                <td th:text="${e.dateNaissance}"></td>
                <td th:text="${e.sexe}"></td>
                <td th:text="${e.tuteur.nom}"></td>
                <td th:text="${e.dateEntree}"></td>
                <td><span class="badge" th:classappend="${e.statut.name() == 'ACTIF'} ? 'validee' : 'contrepassee'" th:text="${e.statut}"></span></td>
                <td><a th:href="@{/enfants/{id}/edit(id=${e.id})}">Modifier</a></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
